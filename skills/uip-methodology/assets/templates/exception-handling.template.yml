version: "0.1"

# The default handling of a business exception: what the robot does when no handling is stated for the exception.
# It lives in the repository the documents are generated into (for example docs/exception-handling.yaml), not in the skill.
# `cli.py build-data --exception-handling docs/exception-handling.yaml` reads it. The list fills the region
# `default_be_handling` (PDD chapter 3). An empty list leaves the region at [TBD]; the skill states no default handling.
#
# Text = text a person reads. Always a pair, both keys required: { de: string, en: string }
# (checked by scripts/lint_yaml_text.py; the file name must start with "exception-handling").

default_be_handling:
  - Text                        # one step of the handling, in the order the robot does it

# The default handling of an unforeseen application error (PDD chapter 3, region `default_se_handling`).
# An empty list leaves the region at [TBD]; the skill states no default handling, no retry count and no alert address.
default_se_handling:
  - Text                        # one step of the handling, in the order the robot does it
