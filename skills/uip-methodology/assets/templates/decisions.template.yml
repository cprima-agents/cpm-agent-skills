version: "0.1"

# Text = text a person reads. Always a pair, both keys required:
#   { de: string, en: string }
# A plain string in a Text field is a linter error (scripts/lint_yaml_text.py).
# Identifiers, refs, enums and names are never pairs.
# Values quoted from a source (for example a field value) keep their original wording.
#
# Status = New | InProgress | UnderReview | Approved | Rejected | Complete
# A status is a single tag on an item. It is optional; when present, the linter accepts only these six spellings.
# Tags = a list of kebab-case words on an item. Optional. Reserved tag: open-question.
# (Definitions of status and tags: see process.template.yml.)

# The measures the business names, by code. An outcome lists the codes it triggers in `actions`.
actions:
  CODE:                         # e.g. FZA, D14
    business_text: Text         # the business's own words for the measure

decisions:
  - id: string                 # required; the decision's own id (SCREAMING_SNAKE), not a step id. A decision is a thing
                                #   of its own: a step of process.yaml points at it with `decision: <id>` — the task
                                #   that makes it, and the gateways that branch on its result.
                                # The order in this file is the order of the sections in the decisions chapter.
    status: Status              # optional
    tags: [string]              # optional
    question: Text              # required; business question being evaluated (may be German)
    inputs:                     # required; the data the decision reads; [] when not known yet
      - field: string           # ENTITY.Field of data-model.yaml (entity id, field name); checked by the linter
        valid_values:           # optional; expected enum values for this input
          - string
    match: Text                 # optional; how the rules apply (for example: the reasons must match exactly)
    no_match: Text              # optional; what happens when no rule applies
    system: string              # required; system performing the evaluation; "none (field value check)" if local only
    sap_transaction: string     # optional; single SAP T-Code used (SAP decisions only)
    sap_transactions:           # optional; list form when multiple T-Codes may be used
      - string
    lookup_logic:               # optional; freetext rules describing how the system answer is interpreted
      - string
    detection_logic:            # optional; field-format rules used to classify input (e.g. ID prefix checks)
      - string
    three_checks:               # optional; PEPPOL three-check pattern — list the three named checks
      - string
    notes:                      # optional; design constraints, known edge cases, open points
      - Text
    outcomes:                   # required; one entry per rule (a possible result of the decision)
      - id: string              # optional; id of the business rule, e.g. DEC-001
        status: Status          # optional
        tags: [string]          # optional
        reasons:                # optional; the exact set of reasons found in the data that selects this outcome
          - Text                #   the business's wording, with its translation
        remark: Text            # optional; the remark the business attaches to the rule
        actions: [string]       # optional; codes from the top-level `actions`; [] = no action decided
        note: Text              # optional; explanation of the rule
        result: Text           # required; human-readable branch label (may be German; e.g. "Ja", "Nein (Beendigung)")
        action: Text            # required; what the bot does on this branch (one sentence)
                                # No `next`: a rule does not name a step. The flow is in the edges of process.yaml.
        exception: string       # optional; ref to exceptions[].id raised on this branch
        terminal: string|false  # optional; ref to terminal_states[].id if this branch ends the process;
                                #   false or omitted = flow continues (non-blocking exception)
        observation:            # required; audit trail text appended to Meta.Observations at runtime
          de: string            # German text; use {FieldName} placeholders for runtime values
          en: string            # English text; use {FieldName} placeholders for runtime values
